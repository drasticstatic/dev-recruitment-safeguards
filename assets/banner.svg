<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="260" viewBox="0 0 1200 260" role="img" aria-labelledby="t d">
  <title id="t">dev-recruitment-safeguards</title>
  <desc id="d">Know the long con before it reaches your laptop The picture: an arch of 9 stones lights from both sides inward until the keystone is reached. With reduced motion, the finished picture shows at once.</desc>
  <style>
    /* Motion only for readers who have not asked for less. Outside this block everything is in its finished state. */
    @media (prefers-reduced-motion: no-preference) {
      .draw { stroke-dasharray: 100; animation: draw 2.6s cubic-bezier(.4,0,.2,1) both; }
      .arrive { animation: arrive .5s ease-out both; }
      .breathe { transform-box: fill-box; transform-origin: center; animation: breathe 8s steps(48) 3s infinite; }
      .halo { transform-box: fill-box; transform-origin: center; animation: halo 5s steps(60) 3.6s infinite; }
    }
    @keyframes draw { from { stroke-dashoffset: 100 } to { stroke-dashoffset: 0 } }
    @keyframes arrive { from { opacity: 0 } to { opacity: 1 } }
    @keyframes breathe { 0%, 100% { transform: scale(1) } 50% { transform: scale(1.07) } }
    @keyframes halo { 0% { opacity: .55; transform: scale(1) } 70%, 100% { opacity: 0; transform: scale(2.1) } }
    .halo { opacity: 0 }
  </style>
  <defs>
    <linearGradient id="ground" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#1a1a2e"/><stop offset="1" stop-color="#0f3460"/></linearGradient>
    <linearGradient id="line" gradientUnits="userSpaceOnUse" x1="668" y1="0" x2="1160" y2="0"><stop offset="0.00" stop-color="#804c5a"/><stop offset="0.50" stop-color="#b87082"/><stop offset="1.00" stop-color="#ddb5bf"/></linearGradient>
    <linearGradient id="fade" gradientUnits="userSpaceOnUse" x1="620" y1="0" x2="1200" y2="0"><stop offset="0" stop-color="#b87082" stop-opacity="0"/><stop offset=".35" stop-color="#b87082"/><stop offset="1" stop-color="#ddb5bf"/></linearGradient>
    <clipPath id="card"><rect width="1200" height="260" rx="18"/></clipPath>
    <radialGradient id="ember" gradientUnits="userSpaceOnUse" cx="962" cy="124" r="390"><stop offset="0" stop-color="#800020" stop-opacity=".8"/><stop offset=".6" stop-color="#5c1a2b" stop-opacity=".45"/><stop offset="1" stop-color="#5c1a2b" stop-opacity="0"/></radialGradient>
  </defs>
  <g clip-path="url(#card)">
    <!-- an opaque ground: the same picture on GitHub's light and dark themes -->
    <rect width="1200" height="260" fill="url(#ground)"/>
    <rect width="1200" height="260" fill="url(#ember)"/>
    <path d="M872.8 220A120 120 0 0 1 1112.8 220Z" fill="#3a2b3f" fill-opacity=".28"/>
    <path class="arrive" style="animation-delay:0.30s" d="M850.8 217.4A142 142 0 0 1 858.5 173.8" fill="none" stroke="#614154" stroke-width="28"/>
    <path class="arrive" style="animation-delay:0.58s" d="M860.3 169.0A142 142 0 0 1 882.4 130.7" fill="none" stroke="#774d60" stroke-width="28"/>
    <path class="arrive" style="animation-delay:0.86s" d="M885.7 126.8A142 142 0 0 1 919.6 98.3" fill="none" stroke="#8c586b" stroke-width="28"/>
    <path class="arrive" style="animation-delay:1.14s" d="M924.0 95.8A142 142 0 0 1 965.6 80.6" fill="none" stroke="#a26476" stroke-width="28"/>
    <path class="arrive" style="animation-delay:1.42s" d="M970.7 79.7A142 142 0 0 1 1015.0 79.7" fill="none" stroke="#ddb5bf" stroke-width="34"/>
    <path class="arrive" style="animation-delay:1.14s" d="M1020.0 80.6A142 142 0 0 1 1061.6 95.8" fill="none" stroke="#a26476" stroke-width="28"/>
    <path class="arrive" style="animation-delay:0.86s" d="M1066.0 98.3A142 142 0 0 1 1099.9 126.8" fill="none" stroke="#8c586b" stroke-width="28"/>
    <path class="arrive" style="animation-delay:0.58s" d="M1103.2 130.7A142 142 0 0 1 1125.4 169.0" fill="none" stroke="#774d60" stroke-width="28"/>
    <path class="arrive" style="animation-delay:0.30s" d="M1127.1 173.8A142 142 0 0 1 1134.8 217.4" fill="none" stroke="#614154" stroke-width="28"/>
    <circle class="halo" cx="992.8" cy="78.0" r="22" fill="none" stroke="#ddb5bf" stroke-width="2"/>
    <circle cx="922.9" cy="177.6" r="2.5" fill="#ddb5bf" opacity=".7"/>
    <circle cx="1006.9" cy="144.0" r="2.5" fill="#ddb5bf" opacity=".7"/>
    <circle cx="948.5" cy="140.5" r="2.4" fill="#ddb5bf" opacity=".7"/>
    <circle cx="1069.1" cy="172.9" r="2.4" fill="#ddb5bf" opacity=".7"/>
    <rect x="0.0" y="248" width="300.5" height="12" fill="#1a1a2e"/><rect x="300.0" y="248" width="300.5" height="12" fill="#5c1a2b"/><rect x="600.0" y="248" width="300.5" height="12" fill="#800020"/><rect x="900.0" y="248" width="300.5" height="12" fill="#fbeef1"/>
    <g font-family="Helvetica Neue, Helvetica, Arial, sans-serif"><text x="56" y="82.1" fill="#c78f9d" font-size="15" font-weight="700" letter-spacing=".6">Security awareness</text><text x="56" y="130.4" fill="#fbeef1" font-size="42" font-weight="700" letter-spacing="-.5">dev-recruitment-safeguards</text><text x="56" y="171.3" fill="#dcd0d6" font-size="23">Know the long con before it reaches your laptop</text></g>
  </g>
</svg>
